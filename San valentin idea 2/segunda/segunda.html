<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recuerdos – Parte 2</title>

    <!-- Fuente pixel -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="styles2.css">
</head>

<body>

    <!-- Caja de texto -->
    <div class="cuadro-texto">
        <p id="textoAnimado"></p>
    </div>

    <!-- Regalo (botón) -->
    <div class="regalo">
        <img src="regalo.png" alt="Regalo" id="abrirGaleria">
    </div>

    <!-- Ventana emergente -->
    <div class="modal" id="modal">
        <span class="cerrar" id="cerrar">&times;</span>
        <img id="imagenModal" src="img1.jpeg">
    </div>

    <!-- Flecha siguiente -->
    <div class="flecha">
        <button id="btnSiguiente">➜</button>
    </div>


    <!-- JS -->
    <script src="second.js"></script>
</body>
</html>
